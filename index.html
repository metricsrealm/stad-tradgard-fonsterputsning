    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professionell fönsterputsning med garanti | Städ & Trädgårdsservice</title>
    <script>
      (function() {
        try {
          const params = new URLSearchParams(window.location.search);
          let city = '';
          const paramCity = params.get('city');
          if (paramCity) {
            const decoded = decodeURIComponent(paramCity);
            city = decoded ? (decoded.charAt(0).toUpperCase() + decoded.slice(1)) : '';
          }
          
          window.__initialCity = city;

          function injectCity() {
            document.querySelectorAll('[data-city]').forEach(function(el) {
              el.textContent = city;
            });
            if (city) {
              document.title = "Professionell fönsterputsning i " + city;
            } else {
              document.title = "Professionell fönsterputsning med garanti | Städ & Trädgårdsservice";
            }
          }

          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', injectCity);
          } else {
            injectCity();
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
